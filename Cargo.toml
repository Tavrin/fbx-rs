[package]
name = "fbx-rs"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Pure-Rust loader for FBX 7.x scenes, skins and animation, verified against ufbx"
repository = "https://github.com/Tavrin/fbx-rs"
readme = "README.md"
keywords = ["fbx", "3d", "mesh", "gamedev", "import"]
categories = ["parser-implementations", "game-development", "graphics"]
include = [
    "/src/**/*.rs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/THIRD-PARTY.md",
]

[lib]
name = "fbx_rs"

[features]
default = []
# Unstable: exposes the internal converter modules (syntax DOM projections,
# scene records, the canonical `fbx-scene-canon/1` writer) for the unpublished
# `fbx-parity` workspace crate, its tests and the fuzz targets. Not covered by
# semver; do not depend on it.
parity = ["dep:serde", "dep:serde_json", "dep:sha2"]

[dependencies]
miniz_oxide = "0.8.9"
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }

[workspace]
members = ["parity"]
default-members = [".", "parity"]
