name: CI
# Enable push and pull request triggers when the repository goes public.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: tools/check_public_text.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked -p fbx-rs --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo doc --locked -p fbx-rs --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo build --locked -p fbx-rs --target wasm32-unknown-unknown
