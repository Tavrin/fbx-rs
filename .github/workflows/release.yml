name: Release
# Enable the `push: tags: ['v*']` trigger when the repository goes public.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag and prepare notes
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF" = "refs/tags/v$version"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## / && p {exit} p {print}' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - run: tools/check_public_text.sh
      - run: cargo publish --locked -p fbx-rs --dry-run
      - run: cargo publish --locked -p fbx-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
